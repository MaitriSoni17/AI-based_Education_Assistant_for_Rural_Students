<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="50%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#D45D3E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#F2CC8F"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3D405B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#coralGrad)" filter="url(#subtleShadow)" />
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Academic Graduation Cap Icon from GyaanBot Web App -->
  <g transform="translate(76, 76) scale(15)" stroke="#FFFFFF" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cap Diamond -->
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Tassel Side -->
    <path d="M22 10v6" stroke="#F2CC8F" stroke-width="2.2" />
    <circle cx="22" cy="16.5" r="0.8" fill="#F2CC8F" stroke="none" />
    <!-- Cap Base Arc -->
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" fill="#FFFFFF" fill-opacity="0.08" />
  </g>

  <!-- Small GyaanBot AI Sparkle Dot -->
  <circle cx="360" cy="140" r="16" fill="url(#goldGrad)" />
</svg>
